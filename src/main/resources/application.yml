spring:
  application:
    name: fbshomework

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ShardingSphere 读写分离（替换原来的datasource）
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere.yaml

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fbshomework.fbshomework.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080